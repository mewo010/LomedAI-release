name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Configure Keystore for Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.STORE_PASSWORD || 'android' }}
          ALIAS_PASS: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding KEYSTORE_BASE64 from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "No existing keystore found, generating upload keystore for CI build..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$ALIAS_PASS" \
              -dname "CN=lomedAi, OU=Release, O=lomedAi, L=TelAviv, S=Israel, C=IL"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Locate Generated APK
        id: locate-apk
        run: |
          echo "Listing generated APKs..."
          find app/build/outputs/apk/ -type f -name "*.apk"
          APK_PATH=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mkdir -p output_artifacts
          cp "$APK_PATH" output_artifacts/lomedAi-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lomedAi-APK
          path: output_artifacts/lomedAi-release.apk
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: lomedAi-APK
          path: release_artifacts

      - name: Generate Release Tag & Name
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.$(date +'%Y%m%d%H%M%S')"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=lomedAi $TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          draft: false
          prerelease: false
          files: release_artifacts/lomedAi-release.apk
          body: |
            ### 🚀 lomedAi - שחרור גרסה חדשה
            
            אפליקציית ניהול למידה חכמה למבחנים ובניית תוכניות לימוד מותאמות אישית בעברית מלאה.
            
            **מה חדש בגרסה זו:**
            - 🎯 בחירת שיטת למידה חופשית (שיטת 1-2-3, תרגול ספירלי, Active Recall, טכניקת פיינמן, פומודורו ממוקד)
            - 📚 הגדרת נושאי לימוד ופרקים ספציפיים וחלוקתם החכמה על פני ימי הלימוד
            - ⏱️ טיימר למידה מובנה (Pomodoro & Deep Focus)
            - 📊 דשבורד מעקב התקדמות וספירה לאחור למבחנים ללא נתוני דמה
            - 💜 עיצוב Dark Mode יוקרתי (Neon Violet Glassmorphism)
            - 🇮🇱 תמיכה מלאה ב-RTL ועברית שפת אם
            
            קובץ ה-APK מוכן להורדה והתקנה ישירות במכשיר ה-Android שלכם!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
