name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Locate Generated APK
        id: locate-apk
        run: |
          echo "Listing generated APKs..."
          find app/build/outputs/apk/ -type f -name "*.apk"
          APK_PATH=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mkdir -p output_artifacts
          cp "$APK_PATH" output_artifacts/StudyPlanner-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlanner-APK
          path: output_artifacts/StudyPlanner-release.apk
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: StudyPlanner-APK
          path: release_artifacts

      - name: Generate Release Tag & Name
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.$(date +'%Y%m%d%H%M%S')"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=StudyPlanner $TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          draft: false
          prerelease: false
          files: release_artifacts/StudyPlanner-release.apk
          body: |
            ### 🚀 StudyPlanner - שחרור גרסה חדשה
            
            אפליקציית ניהול למידה חכמה למבחנים ובניית תוכניות לימוד מותאמות אישית בעברית מלאה.
            
            **מה חדש בגרסה זו:**
            - 🎯 מנוע התאמת שיטות למידה חכם (שיטת 1-2-3, תרגול ספירלי, Active Recall, ציר זמן נרטיבי)
            - ⏱️ טיימר למידה מובנה (Pomodoro & Deep Focus)
            - 📊 דשבורד מעקב התקדמות וספירה לאחור למבחנים
            - 💜 עיצוב Dark Mode יוקרתי (Neon Violet Glassmorphism)
            - 🇮🇱 תמיכה מלאה ב-RTL ועברית שפת אם
            
            קובץ ה-APK מוכן להורדה והתקנה ישירות במכשיר ה-Android שלכם!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
